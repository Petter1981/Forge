<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INOVIA FORGE</title>
<style>html,body{margin:0;background:#0b0f17;color:#f5f7fb;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot b{font-size:20px}.boot small{display:block;color:#9da9bb;margin-top:8px}</style>
</head>
<body><div class="boot"><div><b>⚒️ INOVIA FORGE</b><small>Inicializando runtime seguro…</small></div></div>
<script>
(async()=>{
 try{
  const r=await fetch('./forge-app.html',{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status+' cargando aplicación');
  let html=await r.text();
  html=html.replace(/<div id="forgeAdminIdentity">[\s\S]*?<\/div>/,'<div id="forgeAdminIdentity">Sesión administrativa protegida</div>');
  const runtime='<script src="./forge-runtime-fix.js"></scr'+'ipt>';
  html=html.includes('forge-runtime-fix.js')?html:html.replace('</body>',runtime+'</body>');
  document.open();document.write(html);document.close();
 }catch(e){document.body.innerHTML='<div class="boot"><div><b>No se pudo iniciar FORGE</b><small>'+String(e.message||e)+'</small></div></div>';}
})();
</script>
</body></html>
