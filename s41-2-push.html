<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORGE Sprint 41.2 · User Activation Fix</title>
<style>
:root{color-scheme:dark}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0f1726;color:#eef6ff;margin:0;padding:20px}
main{max-width:820px;margin:auto}
.card{background:#192338;border:1px solid #2e3a52;border-radius:16px;padding:18px;margin:14px 0}
button{width:100%;padding:17px;border:0;border-radius:14px;background:#ff8500;color:#111;font-weight:900;font-size:18px;margin-top:10px}
button:disabled{opacity:.55}
input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #40506c;background:#0f1726;color:white;font-size:16px}
.ok{color:#72e6a6} .warn{color:#ffd166} .muted{color:#a9bfd8} #activate{display:none} .step{padding:7px 0}
</style>
</head>
<body>
<main>
<h1>⚡ FORGE · Sprint 41.2 User Activation Fix</h1>
<div class="card"><strong>Origen:</strong> GitHub Pages HTTPS. Service Worker y UI comparten el mismo origen seguro.</div>
<div class="card">
<h2>1. Owner HTTPS</h2>
<div id="authStatus" class="muted">Comprobando sesión…</div>
<div id="loginBox">
<input id="email" type="email" autocomplete="username" placeholder="Correo Owner">
<input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
<button id="login">Entrar como Owner</button>
</div>
</div>
<div class="card">
<h2>2. Push REAL</h2>
<div id="env" class="muted">Diagnóstico del navegador pendiente.</div><button id="activate">Activar y probar Push REAL</button>
<div id="status" class="muted">Esperando autenticación.</div>
<div id="trace"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://aezyaoyghkvvdciatnct.supabase.co';
const SB_KEY="sb_publishable_sFBO4x6k0KhDdHUVPNdeAw_aUj6rhod";
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
function trace(t,ok=true){const d=document.createElement('div');d.className='step '+(ok?'ok':'warn');d.textContent=(ok?'✅ ':'⚠️ ')+t;$('trace').appendChild(d)}
async function wt(p,ms,label){let timer;const timeout=new Promise((_,rej)=>timer=setTimeout(()=>rej(new Error(label+' excedió '+Math.round(ms/1000)+'s')),ms));try{return await Promise.race([p,timeout])}finally{clearTimeout(timer)}}
async function edge(slug,payload=null,method='POST'){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sesión Owner ausente o vencida.');const opt={method,headers:{Authorization:'Bearer '+session.access_token,apikey:SB_KEY,'Content-Type':'application/json'}};if(payload!==null)opt.body=JSON.stringify(payload);const r=await wt(fetch(SB_URL+'/functions/v1/'+slug,opt),15000,slug);const d=await wt(r.json().catch(()=>({})),5000,slug+' JSON');if(!r.ok||d.ok===false)throw new Error(d.error||('HTTP '+r.status));return d}
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=(s+p).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}
async function refreshEnv(){try{
 const p=['Origen: '+location.origin,'Notification: '+(window.Notification?Notification.permission:'no disponible'),
 'SW: '+('serviceWorker' in navigator?'sí':'no'),'PushManager: '+('PushManager' in window?'sí':'no'),
 'UserActivation API: '+(navigator.userActivation?'sí':'no')];
 if('permissions' in navigator){try{const q=await navigator.permissions.query({name:'notifications'});p.push('Permissions API: '+q.state)}catch{}}
 $('env').textContent=p.join(' · ');
}catch(e){$('env').textContent='Diagnóstico: '+String(e.message||e)}}
async function refreshAuth(){const {data:{session}}=await sb.auth.getSession();if(session){$('authStatus').innerHTML='<span class="ok">✅ Sesión Owner HTTPS activa.</span>';$('loginBox').style.display='none';$('activate').style.display='block';$('status').textContent='Listo para la prueba Push.';return true}$('authStatus').innerHTML='<span class="warn">⚠️ Inicie sesión Owner en este origen HTTPS.</span>';$('loginBox').style.display='block';$('activate').style.display='none';return false}
$('login').onclick=async()=>{const b=$('login');b.disabled=true;$('authStatus').textContent='Autenticando…';try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw new Error('Ingrese correo y contraseña.');const {data,error}=await wt(sb.auth.signInWithPassword({email,password}),15000,'Login');if(error)throw error;if(!data.session)throw new Error('Supabase no devolvió sesión.');await refreshAuth()}catch(e){$('authStatus').innerHTML='<span class="warn">⚠️ '+String(e.message||e)+'</span>'}finally{b.disabled=false}};
$('activate').onclick=async()=>{
const b=$('activate');b.disabled=true;$('trace').innerHTML='';
try{
  // CRITICAL: ask permission synchronously from the user gesture BEFORE any await/fetch.
  if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window))
    throw new Error('Este navegador no soporta Web Push completo.');

  const ua=!!(navigator.userActivation&&navigator.userActivation.isActive);
  trace('User activation al entrar al click: '+(ua?'activa':'inactiva')+'.',ua);
  if(!ua && Notification.permission!=='granted')
    throw new Error('El navegador no reconoce este clic como interacción activa.');

  $('status').textContent='Paso 1/7 · permiso de notificaciones (sin llamadas previas)…';
  let perm=Notification.permission;
  if(perm==='denied')
    throw new Error('Notificaciones bloqueadas para este sitio. Habilítelas desde permisos del sitio.');
  if(perm!=='granted'){
    perm=await wt(Notification.requestPermission(),12000,'Permiso de notificaciones');
  }
  if(perm!=='granted') throw new Error('Permiso de notificaciones: '+perm);
  trace('Permiso concedido dentro del gesto del usuario.');

  $('status').textContent='Paso 2/7 · verificando VAPID…';
  const n=await edge('forge-notify',null,'GET');
  if(!n.vapidConfigured||!n.vapidPublicKey) throw new Error('VAPID no disponible.');
  trace('VAPID disponible ('+(n.vapidSource||'server')+').');

  $('status').textContent='Paso 3/7 · registrando Service Worker…';
  const reg=await wt(navigator.serviceWorker.register('./sw-push.js?v=412',{scope:'./'}),15000,'Service Worker');
  await wt(navigator.serviceWorker.ready,15000,'Service Worker ready');
  trace('Service Worker activo.');

  $('status').textContent='Paso 4/7 · creando/recuperando suscripción Push…';
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await wt(reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(n.vapidPublicKey)}),15000,'PushManager.subscribe');
  trace('Suscripción Push disponible.');

  $('status').textContent='Paso 5/7 · guardando suscripción…';
  await edge('forge-notify',{action:'subscribe',subscription:sub.toJSON(),userAgent:navigator.userAgent});
  trace('Suscripción guardada en FORGE.');

  $('status').textContent='Paso 6/7 · comprobando persistencia…';
  const chk=await edge('forge-notify',null,'GET');
  const count=Number(chk.subscriptions??chk.subscriptionCount??chk.enabledSubscriptions??0);
  trace('Backend consultado después de guardar. Suscripciones reportadas: '+count+'.');

  $('status').textContent='Paso 7/7 · enviando Push firmado…';
  const t=await edge('forge-notify',{action:'test_push',title:'FORGE',body:'Push REAL firmado activo.',url:location.href});
  if(!(t.sent>0)) throw new Error('FORGE no confirmó envío. sent='+(t.sent??'N/D'));
  trace('Push firmado enviado: '+t.sent+'.');
  $('status').innerHTML='<span class="ok">🎉 PUSH REAL ✅ · Sprint 41.2 cerrado</span>';
}catch(e){
  $('status').innerHTML='<span class="warn">⚠️ '+String(e.message||e)+'</span>';
  trace(String(e.message||e),false);
}finally{b.disabled=false}
};
refreshEnv();refreshAuth();
</script>
</main>
</body>
</html>
